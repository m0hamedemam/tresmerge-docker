services:
  postgres:
    image: postgres:latest
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: example
      POSTGRES_DB: testDB
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d

  mongo:
    image: mongo:latest
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    volumes:
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js
    ports:
      - "27017:27017"

  redis:
    image: redis:latest
    ports:
      - "6379:6379"

  app:
    build: .
    environment:
      - DB_USER=root  # Change from postgres to root
      - DB_PASSWORD=example  # Make sure this matches POSTGRES_PASSWORD
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=testDB
      - MONGO_USER=root
      - MONGO_PASSWORD=example
      - MONGO_HOST=mongo
      - MONGO_PORT=27017
      - MONGO_DB=testDB
      - REDIS_URL=redis://redis:6379
    deploy:
      replica: 4
      update_config: 
       parallelism: 2
       delay: 10s
      restart_policy:
       condition: on-failure
       delay: 5s 
    depends_on:
      - postgres
      - mongo
      - redis

  nginx:
    image: nginx:stable-alpine
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "8080:80"
    environment:
      - NGINX_HOST=foobar.com
      - NGINX_PORT=80
    depends_on:
      - app

volumes:
  postgres-data:
